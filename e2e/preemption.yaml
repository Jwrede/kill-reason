apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: e2e-low}
value: 1000
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: e2e-high}
value: 1000000
---
apiVersion: v1
kind: Pod
metadata: {name: victim}
spec:
  priorityClassName: e2e-low
  terminationGracePeriodSeconds: 1
  nodeSelector: {kubernetes.io/hostname: WORKER}
  containers:
    - name: app
      image: busybox:1.37
      command: [sleep, "3600"]
      resources:
        requests: {cpu: CPU_REQUEST}
