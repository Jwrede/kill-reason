apiVersion: v1
kind: Pod
metadata: {name: oom}
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: hog
      image: polinux/stress:1.0.4
      command: [stress, --vm, "1", --vm-bytes, 100M, --vm-hang, "1"]
      resources:
        limits: {memory: 24Mi}
---
apiVersion: v1
kind: Pod
metadata: {name: liveness}
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: app
      image: busybox:1.37
      command: [sleep, "3600"]
      livenessProbe:
        httpGet: {path: /healthz, port: 8080}
        initialDelaySeconds: 3
        periodSeconds: 3
        failureThreshold: 1
---
apiVersion: v1
kind: Pod
metadata: {name: deadline}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 8
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37
      command: [sleep, "3600"]
---
apiVersion: v1
kind: Pod
metadata: {name: disk}
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37
      command: [sh, -c, "dd if=/dev/zero of=/data/fill bs=1M count=20 && sleep 3600"]
      resources:
        limits: {ephemeral-storage: 1Mi}
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata: {name: crash}
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: [sh, -c, "sleep 2; exit 3"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.37
          command: [sleep, "3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web2}
spec:
  replicas: 1
  selector:
    matchLabels: {app: web2}
  template:
    metadata:
      labels: {app: web2}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.37
          command: [sleep, "3600"]
