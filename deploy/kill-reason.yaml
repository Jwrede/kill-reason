# kill-reason: classifies why containers and pods end and records it as an Event on the pod.
# Before applying, create the audit token secret:
#   kubectl create namespace kill-reason
#   kubectl -n kill-reason create secret generic kill-reason-audit-token --from-literal=token="$(openssl rand -hex 24)"
apiVersion: v1
kind: Namespace
metadata:
  name: kill-reason
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kill-reason
  namespace: kill-reason
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kill-reason
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch, create]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kill-reason
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kill-reason
subjects:
  - kind: ServiceAccount
    name: kill-reason
    namespace: kill-reason
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kill-reason
  namespace: kill-reason
spec:
  replicas: 1
  selector:
    matchLabels: {app: kill-reason}
  template:
    metadata:
      labels: {app: kill-reason}
    spec:
      serviceAccountName: kill-reason
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kill-reason
          image: REGISTRY/kill-reason:latest
          args: [serve, --listen=:8080, --settle=40s, --audit-token-file=/var/run/kill-reason/token]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: token, mountPath: /var/run/kill-reason, readOnly: true}
      volumes:
        - name: token
          secret: {secretName: kill-reason-audit-token}
---
apiVersion: v1
kind: Service
metadata:
  name: kill-reason
  namespace: kill-reason
spec:
  selector: {app: kill-reason}
  ports:
    - {name: http, port: 80, targetPort: http}
